name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 8 * * 1'  # Dushanba soat 8:00
    - cron: '0 8 * * 4'  # Payshanba soat 8:00

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s "https://etllsvlxtdumbwugxvia.supabase.co/rest/v1/categories?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
